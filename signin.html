<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Sign in to your NEXUS account to discover, watch, and share videos from creators around the world.">
  <meta name="theme-color" content="#0D0D0F">

  <title>Sign In — NEXUS</title>

  <!-- Stylesheets (reuse existing NEXUS design system) -->

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/pages/signin.css">
</head>

<body data-theme="dark">

  <!-- Floating Theme Toggle -->
  <button class="signin-page__theme-toggle" id="theme-toggle" aria-label="Switch to light mode">
    <!-- Sun icon (shown in dark mode) -->
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="5" />
      <line x1="12" y1="1" x2="12" y2="3" />
      <line x1="12" y1="21" x2="12" y2="23" />
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
      <line x1="1" y1="12" x2="3" y2="12" />
      <line x1="21" y1="12" x2="23" y2="12" />
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
    </svg>
    <!-- Moon icon (shown in light mode) -->
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" aria-hidden="true" style="display: none;">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </svg>
  </button>

  <!-- ============================================================
       MAIN — Sign In
       ============================================================ -->
  <main class="signin-page" id="main-content">

    <h1 class="sr-only">Sign In — NEXUS</h1>

    <div class="signin-card">

      <!-- Logo (links to home) -->
      <a href="index.html" class="signin__logo" aria-label="NEXUS Home">
        <svg class="signin__logo-icon" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true">
          <rect width="28" height="28" rx="6" fill="currentColor" />
          <path d="M8 8L20 14L8 20V8Z" fill="#FFFFFF" />
        </svg>
        <span class="signin__logo-text">NEXUS</span>
      </a>

      <p class="signin__tagline">Discover. Watch. Share.</p>

      <!-- Signed-in status (hidden by default, shown via JS if already authenticated) -->
      <div class="signin__status" id="signin-status" hidden role="status">
        <p>Signed in as <strong id="signin-status-name"></strong></p>
        <button type="button" class="signin__status-action" id="btn-signout">Sign out</button>
      </div>

      <!-- ===== Sign In Form ===== -->
      <form class="signin__form" id="signin-form" novalidate>

        <!-- Email / Username -->
        <div class="signin__field" id="field-email">
          <label class="signin__label" for="signin-email">Email or username</label>
          <input type="email" class="signin__input" id="signin-email" name="email" placeholder="you@example.com"
            autocomplete="email" required>
          <p class="signin__error" id="error-email" role="alert" aria-live="polite"></p>
        </div>

        <!-- Password -->
        <div class="signin__field" id="field-password">
          <label class="signin__label" for="signin-password">Password</label>
          <div class="signin__input-wrapper">
            <input type="password" class="signin__input signin__input--has-toggle" id="signin-password" name="password"
              placeholder="Enter your password" autocomplete="current-password" required minlength="6">
            <button type="button" class="signin__password-toggle" id="password-toggle" aria-label="Show password">
              <!-- Eye icon (password hidden) -->
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <!-- Eye-off icon (password visible) -->
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
          <p class="signin__error" id="error-password" role="alert" aria-live="polite"></p>
        </div>

        <!-- Remember Me / Forgot Password -->
        <div class="signin__options">
          <label class="signin__checkbox-label">
            <input type="checkbox" class="signin__checkbox" id="signin-remember" name="remember">
            <span class="signin__checkbox-mark" aria-hidden="true"></span>
            <span>Remember me</span>
          </label>
          <a href="#" class="signin__forgot" id="link-forgot">Forgot password?</a>
        </div>

        <!-- Submit -->
        <button type="submit" class="signin__submit" id="signin-submit">
          <span class="signin__submit-text">Sign In</span>
          <span class="signin__submit-loader" aria-hidden="true"></span>
        </button>

      </form>

      <!-- Continue as Guest -->
      <a href="index.html" class="signin__guest">Continue as Guest</a>

      <!-- Divider -->
      <div class="signin__divider" role="separator">
        <span>or continue with</span>
      </div>

      <!-- Social Sign-In Placeholders (UI only — no real auth) -->
      <div class="signin__social">
        <button type="button" class="signin__social-btn" id="social-google"
          aria-label="Continue with Google (coming soon)">
          <!-- Google icon (monochrome placeholder) -->
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M12.545 10.239v3.821h5.445c-.712 2.315-2.647 3.972-5.445 3.972a6.033 6.033 0 1 1 0-12.064c1.498 0 2.866.549 3.921 1.453l2.814-2.814A9.969 9.969 0 0 0 12.545 2C7.021 2 2.543 6.477 2.543 12s4.478 10 10.002 10c8.396 0 10.249-7.85 9.426-11.748l-9.426-.013z" />
          </svg>
          Google
        </button>
        <button type="button" class="signin__social-btn" id="social-github"
          aria-label="Continue with GitHub (coming soon)">
          <!-- GitHub icon -->
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2z" />
          </svg>
          GitHub
        </button>
      </div>

      <!-- Create Account -->
      <p class="signin__footer">
        Don't have an account?
        <a href="#" class="signin__create-link" id="link-create-account">Create account</a>
      </p>

    </div>
  </main>

  <!-- Scripts -->
  <script src="js/theme-toggle.js"></script>
  <script src="js/auth.js"></script>

</body>

</html>
